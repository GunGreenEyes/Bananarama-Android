name: test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    # Termux is Linux userland on Android; Ubuntu is the closest runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Shell scripts parse
        run: bash -n install.sh && sh -n bin/bananarama
