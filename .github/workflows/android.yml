name: android
# Builds the app, runs the JVM tests, then runs the app on an Android emulator
# (real services, MediaStore, WebView and intents, against a fake Gemini).
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bananarama-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/**/build/reports/tests/

  emulator:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Emulator test summary
        if: always()
        working-directory: android
        shell: bash
        run: |
          files=$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null || true)
          [ -n "$files" ] || { echo "::error title=Emulator tests::no emulator test results found"; exit 1; }
          # one annotation per test, with the first lines of any failure (readable without signing in)
          node - $files <<'EOF'
          const fs = require('fs');
          let total = 0, bad = 0;
          for (const f of process.argv.slice(2)) {
            const x = fs.readFileSync(f, 'utf8');
            for (const m of x.matchAll(/<testcase name="([^"]*)"[^>]*?(\/>|>([\s\S]*?)<\/testcase>)/g)) {
              total++;
              const fail = /<(failure|error)[^>]*>([\s\S]*?)<\/\1>/.exec(m[3] || '');
              if (fail) {
                bad++;
                const text = fail[2].replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
                  .split('\n').slice(0, 6).join(' | ').slice(0, 900);
                console.log(`::error title=${m[1]}::${text}`);
              } else console.log(`::notice title=passed::${m[1]}`);
            }
          }
          console.log(`::notice title=Emulator tests::${total} tests, ${bad} failed`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Emulator: ${total} tests, ${bad} failed\n`);
          process.exit(total > 0 && bad === 0 ? 0 : 1);
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: android/app/build/reports/androidTests/
