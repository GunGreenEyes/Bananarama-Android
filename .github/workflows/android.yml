name: android
# Builds the app, runs the JVM tests, then runs the app on an Android emulator
# (real services, MediaStore, WebView and intents, against a fake Gemini).
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bananarama-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/**/build/reports/tests/

  emulator:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Emulator test summary
        if: always()
        working-directory: android
        run: |
          files=$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null)
          [ -n "$files" ] || { echo "::error::no emulator test results found"; exit 1; }
          tests=0; failures=0; errors=0
          for f in $files; do
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); tests=$((tests + t))
            x=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); failures=$((failures + x))
            e=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); errors=$((errors + e))
          done
          names=$(grep -ho 'testcase name="[^"]*"' $files | sed 's/testcase name="//; s/"$//' | sort | paste -sd, -)
          echo "::notice title=Emulator tests::$tests tests, $failures failures, $errors errors: $names"
          echo "### Emulator: $tests tests, $failures failures, $errors errors" >> "$GITHUB_STEP_SUMMARY"
          [ "$tests" -gt 0 ] && [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: android/app/build/reports/androidTests/
