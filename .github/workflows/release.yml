name: release
# Push a whole-number tag (v1, v2, ...) - usually via `npm run release`. install.sh on
# the phone installs the latest release, so publishing one is how phones get updates.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check tag matches package.json
        run: |
          tag='${{ github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+$ ]] || { echo "tags must be whole numbers like v2, got $tag"; exit 1; }
          major=$(node -p "require('./package.json').version.split('.')[0]")
          [ "$tag" = "v$major" ] || { echo "tag $tag does not match package.json version $major"; exit 1; }
      - run: npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          git archive --format=tar.gz --prefix=bananarama/ -o "bananarama-android-$tag.tar.gz" "$tag"
          cat > notes.md <<EOF
          Install or update on your phone, in Termux:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`
          EOF
          gh release create "$tag" "bananarama-android-$tag.tar.gz" --title "Bananarama for Android $tag" --notes-file notes.md --generate-notes --latest
